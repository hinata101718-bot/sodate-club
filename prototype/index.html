<title>育ての街クラブ 試作</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* 自分のクラブの色が画面全体を染める。形はシンプル、ボタンに少し丸み（企画書 14・問46） */
:root{
  --club:#1f6f5c; --club-ink:#ffffff; --club-soft:#e3f1ec;
  --bg:#f5f8f7; --card:#ffffff; --fg:#17211e; --muted:#5d6b66; --line:#d8e2de;
  --away:#9a4b2e; --gray:#8b9590; --bronze:#b0703c; --silver:#7d8fa3; --gold:#c99a1c;
  --glow:#ffe27a; --danger:#b8402f; --ok:#2f7d4f;
  --f-disp:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --club-soft:#16302a; --bg:#0f1513; --card:#18211e; --fg:#e7efec; --muted:#9aaaa4; --line:#2a3733;
  --away:#e08a63; --gray:#8d9893; --bronze:#d18e55; --silver:#a9bccf; --gold:#e8bd3c; --glow:#6b5410; --danger:#ef7a66; --ok:#6cc58f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --club-soft:#16302a; --bg:#0f1513; --card:#18211e; --fg:#e7efec; --muted:#9aaaa4; --line:#2a3733;
  --away:#e08a63; --gray:#8d9893; --bronze:#d18e55; --silver:#a9bccf; --gold:#e8bd3c; --glow:#6b5410; --danger:#ef7a66; --ok:#6cc58f;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--club)}
button{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--club);color:var(--club-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.crest{width:38px;height:42px;flex:none}
.top h1{font-family:var(--f-disp);font-size:17px;font-weight:800;margin:0;line-height:1.25}
.top .sub{font-size:12px;opacity:.85}
main{flex:1;padding-block:14px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{font-family:var(--f-disp);font-size:14px;font-weight:700;margin:0 0 8px;color:var(--muted);letter-spacing:.04em}
.goal{font-family:var(--f-disp);font-size:16px;font-weight:700}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.next-match{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:700;font-size:16px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--club-soft);color:var(--club);font-weight:700;font-family:var(--f-body)}
:root:not([data-theme="light"]) .tag{color:var(--fg)}
.tag.away{background:transparent;border:1px solid var(--away);color:var(--away)}
.btn{min-height:48px;border-radius:12px;border:0;padding:0 16px;font-family:var(--f-disp);font-weight:700;font-size:16px;cursor:pointer}
.btn.primary{background:var(--club);color:var(--club-ink)}
.btn.ghost{background:var(--card);border:2px solid var(--club);color:var(--fg)}
.btn.small{min-height:44px;font-size:14px;padding:0 12px}
.btn:focus-visible,.navbtn:focus-visible,.pl:focus-visible,.seg button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice{border-left:0;display:flex;flex-direction:column;gap:8px}
.notice .item{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--club-soft);font-size:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:44px;flex:1;min-width:88px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--club);color:var(--club-ink);border-color:var(--club)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.navbtn{min-height:56px;border:0;background:none;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;font-family:var(--f-disp)}
.navbtn[aria-current="page"]{color:var(--club)}
:root:not([data-theme="light"]) .navbtn[aria-current="page"]{color:var(--fg);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:3px;text-decoration-color:var(--club)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:12px}
td.l,th.l{text-align:left}
tr.me td{background:var(--club-soft);font-weight:700}
tr.up td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
tr.down td:first-child{box-shadow:inset 3px 0 0 var(--danger)}
.plist{display:flex;flex-direction:column;gap:6px}
.pl{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;min-height:52px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:left;cursor:pointer;width:100%}
.pos{display:inline-flex;align-items:center;justify-content:center;width:40px;height:26px;border-radius:7px;font-size:12px;font-weight:800;color:#fff;font-family:var(--f-disp)}
.pos.g{background:#c27a14}.pos.d{background:#2f62a8}.pos.m{background:#2f8a5a}.pos.f{background:#b23b3b}
.pname{font-weight:700;font-size:15px;line-height:1.3}
.pmeta{font-size:12px;color:var(--muted)}
.ovr{font-family:var(--f-disp);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.v{font-variant-numeric:tabular-nums;font-weight:800;font-family:var(--f-disp)}
.c-gray{color:var(--gray)}.c-bronze{color:var(--bronze)}.c-silver{color:var(--silver)}.c-gold{color:var(--gold)}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.attr{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.attr .k{font-size:13px;color:var(--muted)}
.attr .v{font-size:20px}
.attr.glow{background:var(--glow);border-color:var(--gold);animation:glow 1.6s ease-in-out 2}
.attr .up{font-size:12px;color:var(--ok);font-weight:700;margin-left:4px}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 45%,transparent)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.chip.good{border-color:var(--club)}
.chip.bad{border-color:var(--danger);color:var(--danger)}
.chip.new{background:var(--glow);border-color:var(--gold)}
.apt{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;text-align:center;font-size:12px}
.apt b{display:block;font-size:15px}
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .in{max-width:480px;margin:0 auto;padding-block:12px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.sheet .bar{display:flex;align-items:center;gap:10px}
.sheet .bar h2{font-family:var(--f-disp);font-size:18px;margin:0;flex:1}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;font-family:var(--f-disp)}
.score .tn{font-weight:700;font-size:14px;line-height:1.3}
.score .sc{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.minute{font-family:var(--f-disp);font-weight:800;color:var(--muted);font-size:13px}
.scene{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;animation:in .35s ease-out}
.scene.goal{border:2px solid var(--club)}
.scene.goal.opp{border-color:var(--away)}
.scene .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.scene p{margin:0;font-size:16px;line-height:1.75;animation:in .3s ease-out}
.scene .why{font-size:12px;color:var(--muted)}
.gol{font-family:var(--f-disp);font-weight:800;font-size:22px;color:var(--club)}
.scene.opp .gol{color:var(--away)}
.n-me{color:var(--club);font-weight:700}
:root:not([data-theme="light"]) .n-me{color:#7fd3b9}
.n-op{color:var(--away);font-weight:700}
@keyframes in{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
.spfire{display:inline-block;font-size:13px;font-weight:800;font-family:var(--f-disp);padding:2px 10px;border-radius:999px;background:var(--glow);border:1px solid var(--gold);color:var(--fg);margin-right:6px}
.talk{font-size:14px;color:var(--muted);padding:2px 4px;animation:in .3s ease-out}
.cutin{position:fixed;inset:0;z-index:70;display:flex;align-items:center;pointer-events:auto;background:rgba(0,0,0,.35);animation:fade .2s ease-out}
.cutin .band{width:100%;background:var(--club);color:#fff;padding:18px max(20px,env(safe-area-inset-right,0px)) 18px max(20px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:end;
  transform:skewY(-6deg);animation:slide .55s cubic-bezier(.2,1.2,.3,1) both;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.cutin.opp .band{background:var(--away)}
.cutin.sp .band{background:#1d1a10;color:#fff;border-top:4px solid var(--gold);border-bottom:4px solid var(--gold)}
.cutin.sp.opp .band{background:#2a1410}
.cutin .ck{grid-column:1/-1;font-family:var(--f-disp);font-weight:800;font-size:16px;letter-spacing:.12em;color:var(--gold);transform:skewY(6deg)}
.cutin.sp .cg{font-size:40px;color:#fff;text-shadow:0 0 18px rgba(232,189,60,.8)}
.cutin .cg{grid-column:1/-1;font-family:var(--f-disp);font-weight:800;font-size:64px;line-height:1;letter-spacing:.02em;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.3);transform:skewY(6deg)}
.cutin .cw{font-family:var(--f-disp);font-weight:800;font-size:24px;line-height:1.25;transform:skewY(6deg)}
.cutin .cw span{display:block;font-size:13px;font-weight:700;opacity:.85}
.cutin .cs{font-family:var(--f-disp);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;transform:skewY(6deg)}
@keyframes slide{0%{transform:translateX(110%) skewY(-6deg)}100%{transform:translateX(0) skewY(-6deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.talk b{color:var(--fg)}
.log{font-size:14px;display:flex;flex-direction:column;gap:6px}
.log div{padding:6px 0;border-bottom:1px dashed var(--line)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:max(10px,env(safe-area-inset-bottom,0px));padding-top:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock .in2{max-width:448px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.awake{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--club) 92%,black);color:#fff;display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.awake .box{max-width:400px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.awake .kicker{font-family:var(--f-disp);font-weight:800;font-size:56px;line-height:1.1;color:var(--gold);letter-spacing:.04em;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.awake .who{font-family:var(--f-disp);font-weight:800;font-size:28px;line-height:1.3}
.awake .jump{display:flex;align-items:baseline;gap:14px;font-family:var(--f-disp);font-weight:800}
.awake .from{font-size:34px;opacity:.6}
.awake .to{font-size:72px;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.awake .attrname{font-size:16px;font-weight:700}
.awake .quote{font-size:16px;line-height:1.7;max-width:22em}
.awake .btn{background:#fff;color:#111;min-width:200px}
.burst{animation:burst 1.1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes burst{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12px}
.wk{display:flex;flex-direction:column;gap:10px}
.wkp{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.wkp.hot{border:2px solid var(--gold)}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini span{font-size:13px;padding:3px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.mini span.lit{background:var(--glow);border-color:var(--gold);font-weight:700}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.offer{display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
"use strict";
/* ============ 乱数（シード付き。試作の再現用） ============ */
let SEED = 20261110;
function rnd(){ SEED = (SEED*1664525 + 1013904223) >>> 0; return SEED/4294967296; }
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sig=x=>1/(1+Math.exp(-x));
function wpick(items){ let t=0; for(const it of items)t+=it[1]; let r=rnd()*t; for(const it of items){ r-=it[1]; if(r<=0)return it[0]; } return items[items.length-1][0]; }

/* ============ 決まりごと（企画書 8・13） ============ */
const POS=['GK','CB','SB','DM','CM','AM','WG','ST'];
const POSG={GK:'g',CB:'d',SB:'d',DM:'m',CM:'m',AM:'m',WG:'f',ST:'f'};
const AT_F=['スピード','シュート','パス','ドリブル','フィジカル','ディフェンス','スタミナ','IQ'];
const AT_K=['スピード','セービング','キック','飛び出し','フィジカル','ハイボール','スタミナ','IQ'];
const SPD=0,SHT=1,PAS=2,DRI=3,PHY=4,DEF=5,STA=6,IQ=7; /* GKは 1=セービング 2=キック 3=飛び出し 5=ハイボール */
const APT=['×','△','○','◎']; const APTF=[0.62,0.8,0.92,1];
const W={ /* ポジションで大事な能力の重み */
 GK:[.6,3,1,1.5,.6,1.6,.3,1], CB:[.8,.1,.6,.2,1.6,2.2,.6,1.2], SB:[1.4,.2,1,.8,.7,1.4,1.1,.8],
 DM:[.6,.2,1.2,.4,1,1.8,1,1.4], CM:[.7,.5,1.6,.9,.7,.9,1.1,1.5], AM:[.8,1,1.6,1.4,.4,.2,.7,1.6],
 WG:[1.8,.9,1,1.6,.4,.2,.9,.8], ST:[1.3,2.2,.5,1,1.2,.1,.6,1]};
const FORM={
 '4-3-3':['GK','CB','CB','SB','SB','DM','CM','CM','WG','WG','ST'],
 '4-2-3-1':['GK','CB','CB','SB','SB','DM','DM','AM','WG','WG','ST'],
 '4-4-2':['GK','CB','CB','SB','SB','CM','CM','WG','WG','ST','ST'],
 '5-3-2':['GK','CB','CB','CB','SB','SB','DM','CM','CM','ST','ST'],
 '3-4-3':['GK','CB','CB','CB','DM','CM','SB','SB','WG','WG','ST']};
const FORM_ATK={'4-3-3':2,'4-2-3-1':1,'4-4-2':1,'5-3-2':-2,'3-4-3':3};
const STYLES={
 'ロングカウンター':{note:'奪ったら一気に前へ',key:[SPD],scene:{counter:3,through:1.6,longball:2},chanceAdj:-0.4,oppChance:-0.6},
 'ポゼッション':{note:'短いパスで崩す',key:[PAS,IQ],scene:{combo:3,loose:1.4,mid:1},chanceAdj:0.8,oppChance:0},
 'サイドアタック':{note:'横から上げて中で合わせる',key:[PAS,PHY],scene:{cross:3,setpiece:1.6},chanceAdj:0.3,oppChance:0},
 'ローブロック':{note:'自陣に引いて固く守る',key:[DEF,PHY],scene:{counter:1.6,setpiece:1.3},chanceAdj:-1.2,oppChance:-1.6},
 'ゲーゲンプレス':{note:'高い位置でボールを奪う',key:[STA,IQ],scene:{error:3,loose:1.6},chanceAdj:0.6,oppChance:0.5}};

/* 特殊能力（企画書 8-8 から、試作で動かすもの） */
const SP={
 'PKの名手':{t:'shoot',scene:['pk'],at:SHT,b:12},'ミドルシューター':{t:'shoot',scene:['mid'],at:SHT,b:8},
 'パワーヘッダー':{t:'shoot',scene:['cross','setpiece'],at:SHT,b:7,head:1},'冷静沈着':{t:'shoot',scene:['through','combo','counter'],at:SHT,b:4},
 'ゴール前の嗅覚':{t:'shoot',scene:['loose'],at:SHT,b:8},'キラーパス':{t:'pass',scene:['combo'],at:PAS,b:7},
 '正確なクロス':{t:'pass',scene:['cross'],at:PAS,b:7},'広い視野':{t:'pass',scene:['combo','counter'],at:IQ,b:5,chance:0.25},
 'ロングフィード':{t:'pass',scene:['longball','counter'],at:PAS,b:7},'プレースキッカー':{t:'pass',scene:['setpiece'],at:PAS,b:8},
 'ドリブラー':{t:'drib',scene:['dribble'],at:DRI,b:7},'スピードスター':{t:'drib',scene:['through','counter'],at:SPD,b:7},
 'カットイン':{t:'drib',scene:['dribble'],at:SHT,b:6},'フィジカルドリブル':{t:'drib',scene:['dribble'],at:PHY,b:6},
 'ボール奪取':{t:'def',scene:['dribble','combo'],at:DEF,b:7},'エアバトル':{t:'def',scene:['cross','setpiece','longball'],at:PHY,b:7},

function pickLineup(club, form, strengthDiff){
  const sq=squadOf(club).filter(p=>p.inj===0);
  const m=mgrOf(club); const slots=FORM[form]; const used=new Set(); const lineup=[];
  const yb = club.me ? (G.policy==='若手多め'?1.6:G.policy==='勝ち優先'?0.6:1) * m.youth : 1;
  for(const pos of slots){
    let best=null,bs=-1e9;
    for(const p of sq){ if(used.has(p.id))continue;
      let s=posRating(p,pos) + p.cond*1.5 - p.fat*0.06;
      if(p.age<=21) s += 2.2*(yb-1)*3 + (yb>1?1.5:0);
      if(club.me && p.req && rnd()<m.obey) s+=6;
      if(s>bs){bs=s;best=p;}
    }
    if(best){ used.add(best.id); lineup.push({p:best,pos}); }
  }
  const bench=sq.filter(p=>!used.has(p.id));
  return {lineup,bench};
}

}

function eff(side, pl, i, t, scene){
  /* 能力に、調子・疲れ・適性・ホーム・経験・戦い方との相性・特殊能力をのせる（企画書 13-2） */
  const p=pl.p; let v=p.a[i]*APTF[p.apt[pl.pos]];
  v += p.cond*2.2;
  const late=Math.max(0,t-45)/45; let staDrop=(100-p.a[STA])/100*7*late;
  if(p.sp.includes('エンジン')) staDrop*=0.4; if(p.bad.includes('スタミナ切れ')) staDrop*=1.8;
  v -= staDrop + p.fat*0.04;
  if(t<=15 && p.sp.includes('立ち上がりに強い')) v+=2; if(t<=15 && p.bad.includes('スロースターター')) v-=4;
  if(side.home) v+=2;
  v += side.day||0; /* その日の出来（番狂わせの幅） */
  if(p.age<=23 && p.exp<40 && !p.sp.includes('吸収力')) v -= 4*(1-p.exp/40);
  if(STYLES[side.style].key.includes(i)) v+=1.5;
  if(pl.sub && p.sp.includes('スーパーサブ')) v+=3;
  if(p.bad.includes('判断が遅い') && i===IQ && (scene==='combo'||scene==='counter')) v-=5;
  if(p.bad.includes('空中戦が苦手') && i===PHY && (scene==='cross'||scene==='setpiece'||scene==='longball')) v-=6;
  return v;
}

function doSubs(s,o,ev,min){

}

/* 場面の解決と文（企画書 13-2 の表） */
function resolveChance(A,D,min){
  const st=STYLES[A.style];
  const w=Object.entries(SCENE_BASE).map(([k,v])=>[k, v*(st.scene[k]||1)]);
  if(A.on.some(x=>x.p.sp.includes('仕掛け屋'))) w.find(x=>x[0]==='dribble')[1]*=1.6;
  if(A.on.some(x=>x.p.sp.includes('チャンスメーカー'))) w.find(x=>x[0]==='combo')[1]*=1.5;
  if(D.style==='ゲーゲンプレス') w.find(x=>x[0]==='error')[1]*=0.5;
  if(A.style==='ゲーゲンプレス') {}
  const scene=wpick(w);
  const used=[], usedShot=[];
  const g=gk(D); const t=min;
  const N=(side,pl)=>({t:pl.p.name,me:!!side.club.me});
  let att,def,assist=null,steps=[],shotAttr=SHT,shotBonus=0,headed=false,ok=true;
  const mark = D.on.some(x=>x.p.sp.includes('マンマーク'));
  const vs=(a,ai,dpl,di,label,k)=>{ const u=[]; const av=eff(A,a,ai,t,scene)+spBonus(A,a,scene,ai,u,mark); const dv=eff(D,dpl,di,t,scene)+spBonus(D,dpl,scene,di,u,false);
      used.push(...u); const pr=duel(av,dv,k||15); const win=rnd()<pr; steps.push({label,a:a.p.name,d:dpl.p.name,av:Math.round(av),dv:Math.round(dv),win}); return win; };
  const fw=()=>weightedPlayer(byPos(A,['ST','WG','AM']),SHT);
  const cb=()=>pick(byPos(D,['CB','DM']));
  switch(scene){
    case 'through': assist=weightedPlayer(byPos(A,['AM','CM','DM']),PAS); att=weightedPlayer(byPos(A,['ST','WG']),SPD,'スピードスター'); def=cb();
      ok=vs(att,SPD,def,SPD,'抜け出し'); if(ok && g.p.sp.includes('素早い飛び出し')) ok=vs(att,DRI,g,DRI,'GKの飛び出し',9); break;
    case 'dribble': att=weightedPlayer(byPos(A,['WG','AM','ST']),DRI,'仕掛け屋'); def=pick(byPos(D,['SB','CB','DM']));
      ok=vs(att,DRI,def,DEF,'ドリブル突破'); break;
    case 'combo': assist=weightedPlayer(byPos(A,['AM','CM']),PAS,'チャンスメーカー'); def=pick(byPos(D,['DM','CB']));
      ok=vs(assist,PAS,def,DEF,'崩し') ; att=fw(); break;
    case 'cross': assist=weightedPlayer(byPos(A,['WG','SB']),PAS); def=pick(byPos(D,['SB','WG']));
      ok=vs(assist,PAS,def,DEF,'クロス'); att=weightedPlayer(byPos(A,['ST','CB','AM']),PHY,'パワーヘッダー'); if(ok){ ok=vs(att,PHY,cb(),PHY,'競り合い'); } headed=true; break;
    case 'mid': att=weightedPlayer(byPos(A,['AM','CM','DM','WG']),SHT,'ミドルシューター'); def=pick(byPos(D,['DM','CM','CB'])); shotBonus=-9;
      if(def.p.sp.includes('シュートブロック')) ok=vs(att,SHT,def,DEF,'ブロック'); break;
    case 'setpiece': assist=weightedPlayer(A.on,PAS,'プレースキッカー'); att=weightedPlayer(byPos(A,['CB','ST','DM']),PHY,'パワーヘッダー'); def=cb();
      ok=vs(att,PHY,def,PHY,'競り合い'); headed=true; shotBonus=-3; break;
    case 'counter': def=pick(byPos(D,['CM','AM','WG'])); assist=weightedPlayer(byPos(A,['DM','CB','CM']),DEF);
      ok=vs(assist,DEF,def,DRI,'ボール奪取'); att=weightedPlayer(byPos(A,['ST','WG']),SPD,'スピードスター'); if(ok) ok=vs(att,SPD,cb(),SPD,'カウンター'); break;
    case 'loose': att=weightedPlayer(byPos(A,['ST','AM','WG']),IQ,'ゴール前の嗅覚'); def=cb(); ok=vs(att,IQ,def,IQ,'こぼれ球'); shotBonus=2; break;
    case 'pk': att=[...A.on].sort((x,y)=>(y.p.a[SHT]+(y.p.sp.includes('PKの名手')?15:0))-(x.p.a[SHT]+(x.p.sp.includes('PKの名手')?15:0)))[0];
      def=pick(byPos(D,['CB','SB','DM'])); shotBonus=14; break;
    case 'error': def=pick(byPos(D,['CB','GK','DM'])); att=weightedPlayer(byPos(A,['ST','WG','AM']),IQ); var rec=pick(D.on.filter(x=>x!==def&&x.pos!=='GK'));
      ok=vs(att,IQ,def,IQ,'守りのミス',7); break;
    case 'longball': assist=gk(A); att=weightedPlayer(byPos(A,['ST']),PHY); def=cb(); ok=vs(att,PHY,def,PHY,'競り合い'); shotBonus=-4; break;
  }
  if(!att) return null;
  let goal=false, save=false;
  if(ok){
    const u=usedShot; let sv=eff(A,att,SHT,t,scene)+spBonus(A,att,scene,SHT,u,mark)+shotBonus;
    let gv=eff(D,g,SHT,t,scene)+spBonus(D,g,scene,SHT,u,false); /* GKはSHTの位置がセービング */
    if(headed){ gv = (gv + eff(D,g,DEF,t,scene)+spBonus(D,g,scene,DEF,u,false))/2; }
    const pr = sig((sv-gv)/17) * (scene==='pk'?1.15:1.06);
    goal = rnd()<pr; save=!goal;
    steps.push({label:'シュート',a:att.p.name,d:g.p.name,av:Math.round(sv),dv:Math.round(gv),win:goal});
  }
  return {min,scene,att:A,def:D,scorer:att,assist,defender:def,gk:g,ok,goal,save,used:[...used,...usedShot],steps,
    text:narrate(scene,A,D,att,assist,def,g,ok,goal,used,headed,typeof rec!=='undefined'?rec:null,usedShot)};

function playWeek(){
  if(G.week>=22){ endSeason(); return {seasonEnd:true}; }
  const round=G.fixtures[G.week]; let mine=null;
  for(const [h,a] of round){
    const hc=G.clubs[h], ac=G.clubs[a];
    const res=simulateMatch(hc,ac,true);
    const [sh,sa]=res.score; const th=G.table[hc.id], ta=G.table[ac.id];
    th.gf+=sh; th.ga+=sa; ta.gf+=sa; ta.ga+=sh;
    if(sh>sa){th.w++;th.p+=3;ta.l++;} else if(sh<sa){ta.w++;ta.p+=3;th.l++;} else {th.d++;ta.d++;th.p++;ta.p++;}
    if(hc.me||ac.me) mine={res,home:hc.me};
  }
  const report=weeklyGrowth();
  for(const c of G.clubs) if(!c.me) for(const p of c.squad){ p.fat=clamp(p.fat-28,0,100); if(p.inj)p.inj--; }
  G.week++;
  G.lastMatch=mine; G.lastReport=report;
  maybeOffer();
  return {mine,report};
}
function inGrowth(p){ return p.age>=p.gStart && p.age<p.gStart+p.gLen; }
function weeklyGrowth(){
  /* 伸び方：試合・コーチが組む練習・成長期・ポテンシャル（企画書 8-5） */
  const out=[]; const coach=1.0, field=1.0;
  for(const p of G.squad){
    const before=p.a.map(Math.floor); const spBefore=[...p.sp], badBefore=[...p.bad];
    const cap=p.pot; let gp = inGrowth(p)?1:(p.age<p.gStart?0.35:0.12);
    if(p.age>=30) gp=-0.18*(p.age-29)*(p.sp.includes('衰えにくい')?0.5:1);
    const room=Math.max(0,(cap-ovr(p))/30);
    let pr = 0.135*coach*field*(p.sp.includes('練習の虫')?1.5:1);
    let mt = p.played ? 0.22*G.mgr.grow*(p.sp.includes('実戦で伸びる')?1.5:1) : 0;
    let awake=null;
    for(let i=0;i<8;i++){
      const w=W[p.pos][i]/3+0.35;
      let d = gp>0 ? (pr+mt)*gp*w*Math.min(1.4,room)*(0.6+rnd()*0.8) : gp*0.05*(0.5+rnd());
      if(p.a[i]>=99 && d>0) d=0;
      p.a[i]=clamp(p.a[i]+d,10,99);
    }
    /* 大きな伸び（覚醒）：成長期の若手に、ときどき起きる */
    if(gp>=1 && room>0.25 && rnd()< (p.played?0.024:0.006)*(p.sp.includes('キャンプで化ける')&&G.week<3?2:1)){
      const order=[0,1,2,3,4,5,6,7].sort((x,y)=>W[p.pos][y]-W[p.pos][x]);
      const i=order[ri(0,2)]; const jump=ri(10,13);
      const from=Math.floor(p.a[i]); p.a[i]=clamp(p.a[i]+jump,10,99);
      const j2=order[ri(3,5)]; p.a[j2]=clamp(p.a[j2]+ri(3,8),10,99);
      awake={i,from,to:Math.floor(p.a[i])};
    }
    /* 特殊能力が身につく／弱点を克服（企画書 8-8） */
    let newSp=null, cured=null;
    if(p.played && p.sp.length<5 && rnd()<0.01+(awake?0.5:0)){ const pool=[...SP_BY_POS[p.pos],...SP_ANY].filter(s=>!p.sp.includes(s)); if(pool.length){ newSp=pick(pool); p.sp.push(newSp);} }
    if(p.bad.length && p.played && rnd()<0.012){ cured=p.bad.splice(ri(0,p.bad.length-1),1)[0]; }
    /* 調子・疲れ・ケガ */
    const swing = p.sp.includes('安定感')?0.5:p.bad.includes('ムラっけ')?1.8:1;
    p.cond = clamp(Math.round(p.cond*0.5 + (rnd()-0.5)*2.6*swing),-2,2);
    p.fat=clamp(p.fat-30,0,100); const injNew=p.injNew; p.injNew=false; if(p.inj && !injNew) p.inj--;
    const after=p.a.map(Math.floor);
    const ups=after.map((v,i)=>v-before[i]);
    const totalUp=ups.reduce((s,v)=>s+Math.max(0,v),0);
    const big = awake || ups.some(v=>v>=10) || totalUp>=20;
    if(totalUp>0 || newSp || cured || injNew) out.push({p,ups,before,after,awake:big?(awake||{i:ups.indexOf(Math.max(...ups)),from:before[ups.indexOf(Math.max(...ups))],to:after[ups.indexOf(Math.max(...ups))]}):null,newSp,cured,injNew,played:p.played});
    p.played=false;
  }
  out.sort((x,y)=>(y.awake?100:0)+y.ups.reduce((s,v)=>s+Math.max(0,v),0) - ((x.awake?100:0)+x.ups.reduce((s,v)=>s+Math.max(0,v),0)));
  return out;
}
function maybeOffer(){
  /* オーナーが決めること：他クラブからのオファー（問41）。試作では夏と冬の移籍期間だけ */
  const window = (G.week>=10&&G.week<=13) || G.week>=20;
  if(!window || rnd()>0.28) return;
  const cands=G.squad.filter(p=>ovr(p)>=52 && p.inj===0); if(!cands.length) return;
  const p=pick(cands); const club=pick(['横浜ベイスターFC','名古屋グランツ','大阪キャッスルズ','札幌スノーリーフ']);
  const price=Math.round((ovr(p)-40)*(p.age<24?1.6:1)*900/100)*100;
  G.pending.push({type:'offer',pid:p.id,club,price});
}
function endSeason(){
  const rows=standings(); const myRank=rows.findIndex(r=>r.c.me)+1;
  G.lastSeason={season:G.season,rank:myRank,up:myRank<=2,down:false};
  for(const p of G.squad){ p.age++; p.seasonApps=0; p.seasonGoals=0; }
  if(G.lastSeason.up && G.tier>1) G.tier--;
  const TL={3:57,2:69,1:76}; /* 3部50〜60・2部65〜70・1部72〜75（感想 4） */
  for(const c of G.clubs) if(!c.me){ c.lvl=TL[G.tier]+ri(-4,5); c.squad=makeSquad(c.lvl); }
  G.season++; G.week=0; G.fixtures=makeFixtures(12);
  for(const c of G.clubs) G.table[c.id]={p:0,w:0,d:0,l:0,gf:0,ga:0};
}
function standings(){
  return G.clubs.map(c=>({c,...G.table[c.id]})).sort((a,b)=>b.p-a.p || (b.gf-b.ga)-(a.gf-a.ga) || b.gf-a.gf);
}

}

function bindView(){

  v.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.act,b)));
  v.querySelectorAll('[data-pol]').forEach(b=>b.addEventListener('click',()=>{ G.policy=b.dataset.pol; save(); render(); }));
  v.querySelectorAll('[data-pid]').forEach(b=>b.addEventListener('click',()=>openPlayer(+b.dataset.pid)));
  v.querySelectorAll('[data-offer]').forEach(b=>b.addEventListener('click',()=>openOffer(+b.dataset.offer)));
}
function act(a,btn){
  if(a==='week'){ const r=playWeek(); save(); render(); if(r.seasonEnd){ return; } if(r.mine) openMatch(r.mine, ()=>openReport(r.report)); else openReport(r.report); }
  if(a==='skip'){ skipAhead(); }
  if(a==='report'){ openReport(G.lastReport||[]); }
  if(a==='replay'){ if(G.lastMatch) openMatch(G.lastMatch,null); }
  if(a==='reset'){ const box=$('#resetBox'); box.innerHTML=`<span class="muted">ほんとうに最初からやり直しますか？</span><button class="btn small primary" data-act="reset2">やり直す</button><button class="btn small ghost" data-act="cancel">やめる</button>`; box.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.act))); }
  if(a==='reset2'){ try{localStorage.removeItem('sodate-proto-v1');}catch(e){} newGame(); save(); setTab('home'); }
  if(a==='cancel'){ render(); }
}
function skipAhead(){
  /* 次に決めること（オファー・大きな覚醒・シーズン終わり）まで、見どころを飛ばして進む */
  let weeks=0, all=[], last=null;
  while(true){
    if(G.week>=22){ if(weeks===0){ playWeek(); } break; }
    const r=playWeek(); weeks++; all.push(...r.report); last=r;
    if(G.pending.length || r.report.some(x=>x.awake) || G.week>=22 || weeks>=8) break;
  }
  save(); render();
  const merged=mergeReports(all);
  if(weeks>0) openReport(merged, `${weeks}週ぶんの報告`);
}
function mergeReports(list){
  const m=new Map();
  for(const r of list){ const k=r.p.id; if(!m.has(k)) m.set(k,{...r,ups:[...r.ups],before:[...r.before]}); else { const x=m.get(k); x.after=r.after; x.ups=x.after.map((v,i)=>v-x.before[i]); x.awake=x.awake||r.awake; x.newSp=x.newSp||r.newSp; x.cured=x.cured||r.cured; x.injNew=x.injNew||r.injNew; } }
  return [...m.values()].sort((x,y)=>(y.awake?100:0)+y.ups.reduce((s,v)=>s+Math.max(0,v),0) - ((x.awake?100:0)+x.ups.reduce((s,v)=>s+Math.max(0,v),0)));
}

/* ---- 試合の画面：見どころ（メイン）と実況（問35〜37・問63） ---- */
function pickHighlights(res){
  const L=res.log; const goals=L.filter(x=>x.goal);
  const flows=res.ev.filter(e=>e.kind==='flow'); const memos=res.ev.filter(e=>e.kind==='memo').slice(0,2);
  const saves=L.filter(x=>x.save && x.def.club.me).sort((a,b)=>b.steps.at(-1).av-a.steps.at(-1).av).slice(0,1);
  const near=L.filter(x=>!x.goal && x.ok && !saves.includes(x));
  const big = goals.length>=0 && (G.week>=19);
  let want = big? 8 : 6;
  const chosen=new Set([...goals, ...saves]);
  for(const n of near){ if(chosen.size>=want-flows.length-memos.length) break; chosen.add(n); }
  const items=[...chosen].map(x=>({min:x.min,kind:x.goal?'goal':'chance',r:x}));
  for(const f of flows) items.push({min:f.t,kind:'flow',e:f}); for(const m of memos) items.push({min:m.t,kind:'memo',e:m});
  return items.sort((a,b)=>a.min-b.min || (a.kind==='memo'?-1:1));
}
function openMatch(m, after){
  const res=m.res; const [h,a]=res.sides;
  const hl=pickHighlights(res);
  const all=[...res.log.map(r=>({min:r.min,kind:r.goal?'goal':'chance',r})), ...res.ev.map(e=>({min:e.t,kind:e.kind,e}))].sort((x,y)=>x.min-y.min || (x.kind==='talk'?-1:1));
  const layer=$('#layer');
  layer.innerHTML=`<div class="sheet" role="dialog" aria-label="試合"><div class="in">
    <div class="bar"><h2>第${G.week}節</h2></div>
    <div class="card score"><div class="tn" style="color:${h.club.me?'var(--club)':'var(--away)'}">${esc(h.club.name)}</div><div class="sc" id="sc">0 - 0</div><div class="tn" style="color:${a.club.me?'var(--club)':'var(--away)'}">${esc(a.club.name)}</div></div>
    <div class="seg" role="group" aria-label="見方"><button id="mHL" aria-pressed="true">見どころ</button><button id="mLog" aria-pressed="false">実況（試合の流れ全部）</button></div>
    <div id="feed" class="wk"></div>
    <div class="muted small" style="text-align:center">画面のどこを押しても進みます</div>
  </div></div>
  <div class="dock"><div class="in2"><button class="btn ghost" id="mAll">最後まで出す</button><button class="btn primary" id="mNext">次へ</button></div></div>`;
  const feed=$('#feed'), sheet=layer.querySelector('.sheet'); let mode='hl', items=hl;
  let idx=0, card=null, lines=[], k=0, cur=null, cut=null;
  const isMe=it=> it.r ? it.r.att.club.me : true;
  function resultHTML(it){
    if(it.kind==='flow') return `<span class="tag">流れが変わった</span>`;
    if(it.kind==='memo') return `<span class="tag">記念の場面</span>`;
    const r=it.r; if(!r||!r.goal) return '';
    return `${r.flow?`<span class="tag">${r.flow}</span> `:''}${r.mem?`<span class="tag">プロ初ゴール</span> `:''}<span class="gol">ゴール！</span>`;
  }
  /* 新しい行が出たら、下のボタンに隠れないところまで自動で送る（感想 16） */
  const follow=(instant)=>{ requestAnimationFrame(()=>sheet.scrollTo({top:sheet.scrollHeight,behavior:instant?'auto':'smooth'})); };
  /* ゴールのカットイン（感想 17） */
  function goalCut(r){
    const me=r.att.club.me; const el=document.createElement('div'); el.className='cutin'+(me?'':' opp'); el.setAttribute('role','status');
    el.innerHTML=`<div class="band"><div class="cg">ゴール！！</div><div class="cw">${esc(r.scorer.p.name)}<span>${r.min}分 ・ ${esc(r.att.club.name)}</span></div><div class="cs">${r.score.join(' - ')}</div></div>`;
    document.body.appendChild(el); cut=el;
    const close=()=>{ if(cut===el){ el.remove(); cut=null; } };
    el.addEventListener('click',e=>{ e.stopPropagation(); close(); });
    setTimeout(close, 2200);
  }
  /* 特殊能力が働いたときのカットイン（感想 18） */
  function spCut(list){
    const u=list[0]; const el=document.createElement('div'); el.className='cutin sp'+(u.me?'':' opp'); el.setAttribute('role','status');
    el.innerHTML=`<div class="band"><div class="ck">特殊能力発動！</div><div class="cg">${esc(u.sp)}</div><div class="cw">${esc(u.t)}${list.length>1?`<span>ほかに ${list.slice(1).map(x=>esc(x.sp)).join('・')}</span>`:''}</div></div>`;
    document.body.appendChild(el); cut=el;
    const close=()=>{ if(cut===el){ el.remove(); cut=null; } };
    el.addEventListener('click',e=>{ e.stopPropagation(); close(); });
    setTimeout(close, 1800);
  }
  function closeCard(instant){ if(!cur) return; if(cur.r&&cur.r.goal){ card.classList.add('goal'); $('#sc').textContent=cur.r.score.join(' - '); if(!instant) goalCut(cur.r); } card.querySelector('.res').innerHTML=resultHTML(cur); cur=null; }
  function openCard(it){
    cur=it;
    if(it.kind==='talk'){ feed.insertAdjacentHTML('beforeend',`<div class="talk"><b>${it.min}分</b>　<span class="res"></span></div>`); card=feed.lastElementChild; lines=[it.e.text]; k=0; return; }
    feed.insertAdjacentHTML('beforeend',`<div class="scene ${isMe(it)?'':'opp'}"><div class="head"><span class="minute">${it.min}分</span><span class="res"></span></div></div>`); card=feed.lastElementChild; lines=it.r?it.r.text:[it.e.text]; k=0;
  }
  function endCard(){ if(!feed.querySelector('.endcard')){ $('#sc').textContent=res.score.join(' - ');
      feed.insertAdjacentHTML('beforeend',`<div class="card endcard"><b>試合終了 ${res.score.join(' - ')}</b><div class="muted">決定機 ${res.log.length}回（${esc(h.club.name)} ${res.log.filter(x=>x.att===h).length}回 ・ ${esc(a.club.name)} ${res.log.filter(x=>x.att===a).length}回）</div></div>`); }
    $('#mNext').textContent= after?'週の報告へ':'閉じる'; }
  const done=()=> idx>=items.length && !cur;
  /* 1回押すごとに1文ずつ（見どころも実況も：感想 11・14） */
  function tap(instant){
    if(cut){ cut.remove(); cut=null; return; }
    if(cur && k<lines.length){
      if(cur.kind==='talk'){ card.querySelector('.res').outerHTML=line(lines[k]); k++; cur=null; }
      else { const L=lines[k]; card.insertAdjacentHTML('beforeend',`<p>${line(L)}</p>`); k++; const sps=L.filter(x=>x&&x.sp); if(sps.length&&!instant) spCut(sps); if(k>=lines.length) closeCard(instant); }
      if(!instant) follow(); if(done()) endCard(); return; }
    if(idx<items.length){ openCard(items[idx]); idx++; tap(instant); return; }
    if(feed.querySelector('.endcard')) finish(); else endCard();
  }
  function finish(){ if(cut){cut.remove();cut=null;} layer.innerHTML=''; if(after) after(); }
  function restart(m){ mode=m; items= m==='hl'?hl:all; $('#mHL').setAttribute('aria-pressed',String(m==='hl')); $('#mLog').setAttribute('aria-pressed',String(m==='log')); feed.innerHTML=''; idx=0; cur=null; $('#sc').textContent='0 - 0'; $('#mNext').textContent='次へ'; tap(); }
  $('#mNext').addEventListener('click',e=>{ e.stopPropagation(); tap(); });
  $('#mAll').addEventListener('click',e=>{ e.stopPropagation(); if(cut){cut.remove();cut=null;} while(!done()) tap(true); endCard(); follow(true); });
  $('#mHL').addEventListener('click',e=>{ e.stopPropagation(); restart('hl'); });
  $('#mLog').addEventListener('click',e=>{ e.stopPropagation(); restart('log'); });
  /* 画面のどこを押しても進む（感想 13） */
  sheet.addEventListener('click',e=>{ if(e.target.closest('button')) return; tap(); });
  tap();
}

/* ---- 週の報告：伸びた項目が光る（問25）／大きな覚醒は全画面 ---- */
function openReport(rep, title){

    const notes=[r.newSp?`<span class="chip new">新しい特殊能力「${esc(r.newSp)}」</span>`:'', r.cured?`<span class="chip good">弱点「${esc(r.cured)}」を克服</span>`:'', r.injNew?`<span class="chip bad">ケガ（${p.inj}週）</span>`:''].join('');
    return `<button class="wkp ${r.awake?'hot':''}" data-pid="${p.id}" style="text-align:left;cursor:pointer;width:100%"><div class="row">${posTag(p.pos)}<span class="grow pname">${esc(p.name)} <span class="pmeta">${p.age}歳</span></span>${r.awake?'<span class="tag">覚醒</span>':''}</div>${lits?`<div class="mini">${lits}</div>`:''}${notes?`<div class="chips">${notes}</div>`:''}</button>`;
  }).join('') : `<div class="card muted">今週は大きな変化はなかった。</div>`;
  layer.innerHTML=`<div class="sheet" role="dialog" aria-label="週の報告"><div class="in">
    <div class="bar"><h2>${title||'週の報告'}</h2></div>
    <div class="muted">光っているのは、大きく伸びた項目（+2以上）です。選手を押すとくわしく見られます。</div>
    <div class="wk">${body}</div></div></div>
    <div class="dock"><div class="in2" style="grid-template-columns:1fr"><button class="btn primary" id="rClose">ホームへ</button></div></div>`;

function showAwake(list,i){

/* ---- 8角形の能力図（感想 19） ---- */
function radarSVG(p){
  const L=p.pos==='GK'?AT_K:AT_F; const order=p.pos==='GK'?[1,3,2,5,0,4,6,7]:[0,1,2,3,4,5,6,7];
  const cx=160, cy=150, R=100, n=8;
  const pt=(i,v)=>{ const ang=-Math.PI/2 + i*2*Math.PI/n; const r=R*v/99; return [cx+r*Math.cos(ang), cy+r*Math.sin(ang)]; };
  const ring=v=>order.map((_,i)=>pt(i,v).map(x=>x.toFixed(1)).join(',')).join(' ');
  const rings=[25,50,75,99].map(v=>`<polygon points="${ring(v)}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join('');
  const spokes=order.map((_,i)=>{ const [x,y]=pt(i,99); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`; }).join('');
  const shape=order.map((ai,i)=>pt(i,Math.floor(p.a[ai])).map(x=>x.toFixed(1)).join(',')).join(' ');
  const labels=order.map((ai,i)=>{ const [x,y]=pt(i,124); const v=Math.floor(p.a[ai]); const anchor= Math.abs(x-cx)<8?'middle':(x>cx?'start':'end');
    return `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${anchor}" font-size="14" fill="var(--muted)">${L[ai]}</text><text x="${x.toFixed(1)}" y="${(y+21).toFixed(1)}" text-anchor="${anchor}" font-size="15" font-weight="800" class="${colorOf(v)}" fill="currentColor">${v}</text>`; }).join('');
  return `<svg viewBox="-28 0 376 300" width="100%" style="max-width:380px;display:block;margin:0 auto" role="img" aria-label="能力の8角形の図">${rings}${spokes}<polygon points="${shape}" fill="var(--club)" fill-opacity=".28" stroke="var(--club)" stroke-width="2.5" stroke-linejoin="round"/>${labels}</svg>`;
}

/* ---- 選手の画面 ---- */
function openPlayer(id, back){
  const p=G.squad.find(x=>x.id===id); if(!p) return;
  const L=p.pos==='GK'?AT_K:AT_F; const order = p.pos==='GK'?[1,3,2,5,0,4,6,7]:[0,1,2,3,4,5,6,7];
  const rep=(G.lastReport||[]).find(r=>r.p.id===id);
  const o=ovr(p);
  const hint = inGrowth(p)? (p.pot-o>12?'「いま、ぐんぐん伸びている。まだまだ化けるかもしれない」':'「伸びている時期だ。どこまで行けるか楽しみだ」') : (p.age<p.gStart? '「まだ伸びる時期が来ていない。焦らず使い続けたい」' : (p.pot-o<4?'「もう伸びしろは少ないかもしれない」':'「伸びはゆるやかになってきた」'));
  const layer=$('#layer');
  layer.innerHTML=`<div class="sheet" role="dialog" aria-label="選手"><div class="in">
    <div class="bar"><h2>${esc(p.name)}</h2><span class="ovr ${colorOf(o)}">${o}</span></div>
    <div class="row">${posTag(p.pos)}<span class="muted">${p.age}歳 ・ ${p.height}cm ・ 利き足 ${p.foot} ・ ${esc(p.pref)}出身 ・ ${esc(p.origin)}</span></div>
    <section class="card"><h2>能力</h2>${radarSVG(p)}<div class="attrs" style="margin-top:8px">${order.map(i=>{ const v=Math.floor(p.a[i]); const u=rep?rep.ups[i]:0; return `<div class="attr ${u>=2?'glow':''}"><span class="k">${L[i]}</span><span><span class="v ${colorOf(v)}">${v}</span>${u>0?`<span class="up">+${u}</span>`:''}</span></div>`; }).join('')}</div></section>
    <section class="card"><h2>ポジション適性</h2><div class="apt">${POS.map(x=>`<div>${x}<b>${APT[p.apt[x]]}</b></div>`).join('')}</div></section>
    <section class="card"><h2>特殊能力</h2><div class="chips">${p.sp.length?p.sp.map(s=>`<span class="chip good">${esc(s)}</span>`).join(''):'<span class="muted">まだない</span>'}${p.bad.map(s=>`<span class="chip bad">${esc(s)}</span>`).join('')}</div></section>
    <section class="card"><h2>フィジカルコーチのひとこと</h2><div>${hint}</div></section>
    <section class="card"><h2>記録</h2><div class="muted">通算 ${p.apps}試合 ${p.goals}点 ・ 初出場 ${p.firstApp||'まだ'} ・ 初ゴール ${p.firstGoal||'まだ'}</div></section>
    <section class="card"><h2>監督への頼み</h2><button class="btn ${p.req?'primary':'ghost'}" id="pReq" style="width:100%">${p.req?'起用の依頼を取り下げる':'この選手を試合で使ってほしい'}</button><div class="muted small" style="margin-top:6px">早瀬監督は、頼みをわりと素直に聞いてくれる。</div></section>
  </div></div><div class="dock"><div class="in2" style="grid-template-columns:1fr"><button class="btn primary" id="pBack">もどる</button></div></div>`;
  $('#pReq').addEventListener('click',()=>{ p.req=!p.req; save(); openPlayer(id,back); });
  $('#pBack').addEventListener('click',()=>{ layer.innerHTML=''; if(back) back(); else render(); });
}
function openOffer(i){
  const e=G.pending[i]; const p=G.squad.find(x=>x.id===e.pid); const layer=$('#layer');
  layer.innerHTML=`<div class="sheet" role="dialog" aria-label="オファー"><div class="in"><div class="bar"><h2>オファーが届いた</h2></div>
    <section class="card offer"><div><b>${esc(e.club)}</b> が ${esc(p.name)}（${p.age}歳 ・ ${p.pos} ・ ${ovr(p)}）を ${e.price.toLocaleString()}万円 でほしいと言っている。</div>
    <div class="muted">受けると選手はクラブを去る。試作なので、お金はまだ画面に出していません。</div>
    <div class="btns"><button class="btn primary" id="oYes">受ける</button><button class="btn ghost" id="oNo">断る</button></div></section></div></div>`;
  $('#oYes').addEventListener('click',()=>{ G.squad=G.squad.filter(x=>x.id!==p.id); G.pending.splice(i,1); save(); layer.innerHTML=''; render(); });
  $('#oNo').addEventListener('click',()=>{ G.pending.splice(i,1); save(); layer.innerHTML=''; render(); });
}

/* ============ はじめる ============ */
if(!load()){ newGame(); save(); }
render();
</script>
